define command {
    command_name    p1_check_ping
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}

define command {
    command_name    p1_check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 5 -c 10
}

define command {
    command_name    p1_check_http
    command_line    $USER1$/check_http -I $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -w 5 -c 10
}

define command {
    command_name    p1_check_nrpe
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -t 10 -c $ARG1$
}

define command {
    command_name    p1_check_zabbix_api
    command_line    /usr/bin/python3 /usr/local/nagios/libexec/p1-check-zabbix-api.py --url $ARG1$
}

define command {
    command_name    p1_notify_service_by_email
    command_line    /usr/bin/printf '%s\n' "$SERVICEOUTPUT$" | /usr/bin/mail -s "$HOSTNAME$/$SERVICEDESC$ is $SERVICESTATE$" "$CONTACTEMAIL$"
}

define command {
    command_name    p1_notify_host_by_email
    command_line    /usr/bin/printf '%s\n' "$HOSTOUTPUT$" | /usr/bin/mail -s "$HOSTNAME$ is $HOSTSTATE$" "$CONTACTEMAIL$"
}
