# Example escalation behavior; notifications remain disabled by default.
define hostescalation {
    hostgroup_name          p1-linux-servers
    first_notification      2
    last_notification       4
    notification_interval   15
    contact_groups          p1-ops
    escalation_period       p1-24x7
    escalation_options      d,u,r
}

define serviceescalation {
    host_name               db01
    service_description     MariaDB TCP 3306
    first_notification      3
    last_notification       5
    notification_interval   15
    contact_groups          p1-ops
    escalation_period       p1-24x7
    escalation_options      w,u,c,r
}
